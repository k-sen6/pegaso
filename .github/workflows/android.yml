name: APK Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - run: npm ci

      - name: Compilar web para APK
        run: npm run build:apk
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BUILD: ${{ github.sha }}
          NEXT_PUBLIC_SUPABASE_URL: https://guptzbnzkprdrgilrdrx.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1cHR6Ym56a3ByZHJnaWxyZHJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMTc0NDcsImV4cCI6MjEwOTU5MzQ0N30.-lIwFwPSCOp77QiiemTJL8PlR6fPaa3ir4-T-GnSpiE

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Version
        run: |
          echo "PEGA_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "PEGA_VERSION_NAME=1.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Preparar firma
        run: |
          echo "$PEGA_RELEASE_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/pegaso-release.jks"
          echo "PEGA_KEYSTORE_PATH=$RUNNER_TEMP/pegaso-release.jks" >> "$GITHUB_ENV"
        env:
          PEGA_RELEASE_KEY_BASE64: ${{ secrets.PEGA_RELEASE_KEY_BASE64 }}

      - name: Version
        run: |
          echo "PEGA_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PEGA_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "PEGA_VERSION_NAME=1.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          PEGA_KEY_STORE_PASSWORD: ${{ secrets.PEGA_RELEASE_KEY_STORE_PASSWORD }}
          PEGA_KEY_KEY_PASSWORD: ${{ secrets.PEGA_RELEASE_KEY_KEY_PASSWORD }}
          PEGA_KEY_ALIAS: ${{ secrets.PEGA_RELEASE_KEY_ALIAS }}

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk pegaso.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pegaso-apk
          path: pegaso.apk

      - name: Publicar en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pegaso.apk
          generate_release_notes: true
